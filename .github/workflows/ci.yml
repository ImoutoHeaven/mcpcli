name: ci

on:
  push:
    branches: [main, "wip/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/wip/') }}

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-11-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: formatting
        run: cargo fmt --all -- --check
      - name: lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust and CLI E2E (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/ci/run-tests.py
      - name: Rust and CLI E2E (Windows, outside runner Job)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/windows-tests.ps1
      - name: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-native-${{ matrix.os }}
          path: |
            ci-*.log
            ci-*-report.json
            ci-*-artifacts.zip
          if-no-files-found: error

  linux-containers:
    name: native (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: alpine-amd64, runner: ubuntu-24.04, image: "rust:1.92.0-alpine3.23", alpine: true }
          - { name: alpine-arm64, runner: ubuntu-24.04-arm, image: "rust:1.92.0-alpine3.23", alpine: true }
          - { name: debian-amd64, runner: ubuntu-24.04, image: "rust:1.92.0-bookworm", alpine: false }
          - { name: debian-arm64, runner: ubuntu-24.04-arm, image: "rust:1.92.0-bookworm", alpine: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build, lint, unit, protocol and CLI E2E
        env:
          IMAGE: ${{ matrix.image }}
          ALPINE: ${{ matrix.alpine }}
        run: |
          docker run --rm --init -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e ALPINE -e CARGO_BUILD_JOBS=2 -e MCPCLI_REQUIRE_ROOT_TEST=1 \
            -e PYTHONUTF8=1 "$IMAGE" sh -ec '
              if [ "$ALPINE" = true ]; then
                apk add --no-cache python3 build-base bash procps
              else
                apt-get update
                apt-get install -y --no-install-recommends python3 procps
              fi
              rustup component add rustfmt clippy
              cargo fmt --all -- --check
              cargo clippy --locked --all-targets -- -D warnings
              python3 scripts/ci/run-tests.py
            '
      - name: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.name }}
          path: |
            ci-*.log
            ci-*-report.json
            ci-*-artifacts.zip
          if-no-files-found: error

  freebsd:
    name: native (freebsd-15.1-amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build, lint, unit, protocol and CLI E2E
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          arch: x86_64
          mem: 6144
          cpu: 4
          prepare: pkg install -y bash rust python3
          run: |
            set -eu
            export CARGO_TARGET_DIR=/mcpcli-ci-target
            export CARGO_BUILD_JOBS=2
            export MCPCLI_REQUIRE_ROOT_TEST=1
            export PYTHONUTF8=1
            # The root dataset supports the non-root permission regression fixture.
            mkdir -p /mcpcli-ci-tmp
            chmod 1777 /mcpcli-ci-tmp
            export TMPDIR=/mcpcli-ci-tmp
            if (
              freebsd-version &&
              rustc --version &&
              cargo fmt --all -- --check &&
              cargo clippy --locked --all-targets -- -D warnings &&
              python3 scripts/ci/run-tests.py
            ) > ci-freebsd.log 2>&1; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$status" > ci-freebsd-exit-code.txt
            cat ci-freebsd.log
      - name: require VM result
        if: always()
        run: test -f ci-freebsd-exit-code.txt && test "$(cat ci-freebsd-exit-code.txt)" = 0
      - name: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-freebsd-amd64
          path: |
            ci-*.log
            ci-*-report.json
            ci-*-artifacts.zip
            ci-freebsd-exit-code.txt
          if-no-files-found: error

  real-services:
    name: real fastexec and Playwright (stdio + HTTP)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: build
        run: cargo build --locked --release
      - name: install pinned real services
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/mcpcli-services"
          gh release download v0.2.2 --repo ImoutoHeaven/fastexec-mcp \
            --pattern fastexec-0.2.2-linux-amd64.tar.gz --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/mcpcli-services"
          (
            cd "$RUNNER_TEMP/mcpcli-services"
            grep ' fastexec-0.2.2-linux-amd64.tar.gz$' SHA256SUMS | sha256sum -c -
            tar -xzf fastexec-0.2.2-linux-amd64.tar.gz
          )
          npm ci --prefix scripts/ci/real-services
          node scripts/ci/real-services/node_modules/playwright/cli.js install --with-deps chromium
      - name: real-service E2E
        run: |
          chromium="$(node -e "console.log(require('./scripts/ci/real-services/node_modules/playwright').chromium.executablePath())")"
          python3 tests/real_e2e.py --binary target/release/mcpcli \
            --fastexec "$RUNNER_TEMP/mcpcli-services/fastexec-0.2.2-linux-amd64/fastexec" \
            --playwright scripts/ci/real-services/node_modules/@playwright/mcp/cli.js \
            --chromium "$chromium" --report-dir ci-real-services
      - name: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-real-services
          path: ci-real-services
          if-no-files-found: warn

  gate:
    name: all supported platforms passed
    if: always()
    needs: [native, linux-containers, freebsd, real-services]
    runs-on: ubuntu-24.04
    steps:
      - name: require every suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert results and all(job["result"] == "success" for job in results.values()), results
          PY
